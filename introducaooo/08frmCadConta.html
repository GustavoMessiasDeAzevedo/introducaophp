<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Conta</title>
</head>
<body>

<h2>Cadastro de Conta Bancária</h2>

<form action="08frmCadConta.php" method="post">

    <label>Tipo de Conta:</label><br>
    <select name="tipoConta" required>
        <option value="">Selecione</option>
        <option value="poupanca">Poupança</option>
        <option value="especial">Especial</option>
    </select><br><br>

    <label>Agência:</label><br>
    <input type="text" name="agencia" required><br><br>

    <label>Conta:</label><br>
    <input type="text" name="conta" required><br><br>

    <label>Saldo Inicial:</label><br>
    <input type="number" step="0.01" name="saldoInicial" required><br><br>   

    <label>Reajuste (%) (Poupança):</label><br>
    <input type="number" step="0.01" name="reajuste"><br><br>

    <label>Limite Especial (Conta Especial):</label><br>
    <input type="number" step="0.01" name="limiteEspecial"><br><br>

    <button type="submit">Enviar</button>

</form>

</body>
</html>
